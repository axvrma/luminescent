name: Release library
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version already committed to packages/luminescent/package.json
        required: true
        type: string
      publish:
        description: Publish the validated tarball (false creates a dry-run artifact)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check reviewed version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e 'const p = require("./packages/luminescent/package.json"); if (p.version !== process.env.RELEASE_VERSION || !/^\d+\.\d+\.\d+(?:-[\w.-]+)?$/.test(p.version)) process.exit(1)'
      - run: npm ci
      - run: npm run build:lib
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:components
      - run: npm run build-storybook
      - run: npm run test:storybook
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm pack --workspace luminescent --pack-destination .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validated-npm-package
          path: luminescent-*.tgz
      - name: Publish validated package
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish luminescent-*.tgz --access public --provenance
